<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Used Car Price Predictor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background-color: #f5f5f5;
        }

        h1 {
            color: #333;
        }

        form {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        input[type="submit"] {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
        }

        input[type="submit"]:hover {
            background-color: #0056b3;
        }

        h2 {
            margin-top: 30px;
            color: #28a745;
        }
    </style>
</head>
<body>

    <h1>Used Car Price Prediction</h1>

    <form action="/predict" method="POST">
        <label for="year">Year:</label>
        <input type="text" name="year" id="year" value="{{ request.form.year }}" required>

        <label for="km_driven">KM Driven:</label>
        <input type="text" name="km_driven" id="km_driven" value="{{ request.form.km_driven }}" required>

        <label for="fuel_type">Fuel Type:</label>
        <select name="fuel_type" id="fuel_type" required>
            <option value="0" {% if request.form.fuel_type == '0' %}selected{% endif %}>Petrol</option>
            <option value="1" {% if request.form.fuel_type == '1' %}selected{% endif %}>Diesel</option>
        </select>

        <input type="submit" value="Predict">
    </form>

    <h2>{{ prediction_text }}</h2>

</body>
</html>
